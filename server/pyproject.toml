[project]
name = "reclaimmytime-server"
version = "0.1.0"
description = "Backend API for ReclaimMyTime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.121.0",
    "pydantic>=2.12.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "hypothesis>=6.148.0",
    "import-linter>=2.6",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "scheduler-purity"
type = "forbidden"
source_modules = ["app.scheduler"]
forbidden_modules = ["app.agent", "app.api", "app.gcal", "app.db"]
