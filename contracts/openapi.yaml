openapi: 3.1.0
info:
  title: ReclaimMyTime API
  version: 0.1.0
  summary: Contract for the ReclaimMyTime iOS client and FastAPI backend (TECH_SPEC T0.1).
  description: |
    Source of truth for field names/types is the DDL in ARCHITECTURE.md §3. Conventions
    (auth, X-Timezone, error envelope, SSE framing, tstzrange mapping, decisions) are in
    contracts/NOTES.md. Fixtures in contracts/fixtures/ validate against this document via
    contracts/validate_fixtures.py.

    Every write that changes scheduling inputs (projects, preferences, exceptions, block
    edit/delete) is *staged*: it returns `202` with a pending Changeset (staged mutations +
    proposed plan + diff). Nothing is applied until `POST /changesets/{id}/confirm`.
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
servers:
  - url: '{baseUrl}'
    variables:
      baseUrl:
        default: http://localhost:8000
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: projects
  - name: preferences
  - name: exceptions
  - name: plans
  - name: blocks
  - name: pins
  - name: todos
  - name: agent
  - name: changesets
  - name: gcal

paths:
  # ------------------------------------------------------------------ auth
  /auth/google/start:
    post:
      operationId: startGoogleSignIn
      tags: [auth]
      parameters: [{$ref: '#/components/parameters/XTimezoneIgnored'}]
      summary: Build the Google sign-in consent URL (T6.0, NOTES D26).
      description: |
        Unauthenticated. X-Timezone is not required (like POST /auth/apple, D11) and is
        ignored when sent, whatever its value. The app generates a
        random nonce, keeps it, and sends `nonce_hash` = base64url(SHA-256(nonce)) without
        padding. The URL asks for one combined consent (openid, email, calendar.freebusy,
        calendar.app.created; offline access, prompt=consent, PKCE) under an encrypted
        `login` state that carries the nonce hash. Open it in ASWebAuthenticationSession;
        Google redirects to GET /gcal/callback, which 302s to
        `reclaimmytime://auth/google/callback?result=…`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoogleSignInStartRequest'}
      responses:
        '200':
          description: Open `authorization_url` in ASWebAuthenticationSession.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GcalConnectUrl'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/InternalError'}

  /auth/google/complete:
    post:
      operationId: completeGoogleSignIn
      tags: [auth]
      parameters: [{$ref: '#/components/parameters/XTimezoneIgnored'}]
      summary: Finish Google sign-in and get an opaque session token (T6.0, NOTES D26).
      description: |
        Unauthenticated; X-Timezone not required and ignored when sent. Body carries the
        `auth_code` and `state` from the
        `result=authorized` sign-in callback, plus the raw `nonce` the app hashed for
        POST /auth/google/start. The state must decrypt, be unexpired and be a sign-in
        (`login`) state, and base64url(SHA-256(`nonce`)) must equal the hash it carries;
        then the server exchanges the code (PKCE), checks the id_token, and finds or creates
        the user for the Google account (`sub`; no account merging). Always 200 with
        `is_new_user` (as D21). When both calendar scopes were granted and a refresh token
        came back, the calendar connection is stored too, unless the user already has an
        active connection to a different Google account: that one is kept and the new grant
        is discarded (D26). Otherwise the user is signed in without a new connection and the
        partial grant is revoked best-effort.
        `gcal_connected` says whether the user has an active calendar connection after this
        call (false → show the existing connect prompt, GET /gcal/connect). Errors: 400
        `gcal_state_invalid` (bad, expired or connect state, or nonce mismatch — not
        distinguished), 502 `gcal_exchange_failed`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoogleSignInCompleteRequest'}
      responses:
        '200':
          description: Signed in (existing or newly created user; see `is_new_user`).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GoogleAuthSession'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '502': {$ref: '#/components/responses/BadGateway'}
        default: {$ref: '#/components/responses/InternalError'}

  /auth/apple:
    post:
      operationId: signInWithApple
      tags: [auth]
      summary: Exchange a Sign in with Apple credential for an opaque session token.
      description: |
        Server verifies the identity token against Apple's JWKS (signature, exp,
        iss=https://appleid.apple.com, aud=bundle id) and checks that the token's `nonce`
        claim equals SHA-256(`nonce`). The authorization code is exchanged for Apple's
        refresh token (stored encrypted; used to revoke on DELETE /me).
        Optional since T6.0 (D26): a server without Apple configuration answers 503
        `apple_unavailable`; Google sign-in is the primary path.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AppleSignInRequest'}
      responses:
        '200':
          description: Signed in (existing or newly created user; see `is_new_user`).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthSession'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/InternalError'}

  /me:
    get:
      operationId: getMe
      tags: [auth]
      parameters: [{$ref: '#/components/parameters/XTimezone'}]
      responses:
        '200':
          description: The authenticated user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/InternalError'}
    delete:
      operationId: deleteMe
      tags: [auth]
      summary: Delete the account (App Store requirement).
      description: Revokes Google if connected, then each stored Apple refresh token (only users with an Apple identity have one; T6.0), then cascades the user row. Irreversible.
      parameters: [{$ref: '#/components/parameters/XTimezone'}]
      responses:
        '204': {description: Account deleted; all sessions are invalid.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/InternalError'}

  /sessions:
    delete:
      operationId: revokeAllSessions
      tags: [auth]
      summary: Revoke every session for the user, including the current one.
      parameters: [{$ref: '#/components/parameters/XTimezone'}]
      responses:
        '204': {description: All sessions revoked.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/InternalError'}

  /sessions/current:
    delete:
      operationId: revokeCurrentSession
      tags: [auth]
      summary: Sign out (revoke the presented session only).
      parameters: [{$ref: '#/components/parameters/XTimezone'}]
      responses:
        '204': {description: Session revoked.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/InternalError'}

  # ------------------------------------------------------------------ projects
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      parameters:
        - {$ref: '#/components/parameters/XTimezone'}
        - name: include_archived
          in: query
          required: false
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: All confirmed projects (no pagination in v1), ordered by created_at ascending. Projects with status `staged` are excluded; they are visible only inside their pending Changeset (D23).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createProject
      tags: [projects]
      summary: Stage a new project (project_created) and propose a re-solve.
      parameters: [{$ref: '#/components/parameters/XTimezone'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectDraft'}
      responses:
        '202': {$ref: '#/components/responses/ChangesetStaged'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/InternalError'}

  /projects/{project_id}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/XTimezone'}
    get:
      operationId: getProject
      tags: [projects]
      responses:
        '200':
          description: The project (archived projects are still readable; a `staged` project returns 404 `not_found` until its changeset is confirmed — D23).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/InternalError'}
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Stage a partial update (project_updated) and propose a re-solve.
      description: |
        `kind` is immutable. The deadline/perennial field XOR is validated against the merged
        result (422 `validation_failed`). Archiving is DELETE, not `status: archived`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectPatch'}
      responses:
        '200':
          description: Name-only edit, applied directly (not staged; Staging model).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '202': {$ref: '#/components/responses/ChangesetStaged'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/InternalError'}
    delete:
      operationId: archiveProject
      tags: [projects]
      summary: Stage archival (project_archived; status → archived) and propose a re-solve. Rows are never hard-deleted.
      responses:
        '202': {$ref: '#/components/responses/ChangesetStaged'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/InternalError'}

  # ------------------------------------------------------------------ preferences
  /preferences:
    parameters: [{$ref: '#/components/parameters/XTimezone'}]
    get:
      operationId: getPreferences
      tags: [preferences]
      responses:
        '200':
          description: Current preferences.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserPreferences'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/InternalError'}
    put:
      operationId: putPreferences
      tags: [preferences]
      summary: Stage a full replacement of preferences (preferences_updated) and propose a re-solve.
      description: |
        Full replacement (all fields required). Also the path for accepting a timezone change
        (PRD §10): send the new IANA `timezone`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserPreferences'}
      responses:
        '202': {$ref: '#/components/responses/ChangesetStaged'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/InternalError'}

  # ------------------------------------------------------------------ exceptions
  /exceptions:
    parameters: [{$ref: '#/components/parameters/XTimezone'}]
    get:
      operationId: listExceptions
      tags: [exceptions]
      parameters:
        - name: include_past
          in: query
          required: false
          description: Include exceptions whose span ended before now.
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Exceptions ordered by span start ascending (no pagination in v1).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AvailabilityExceptionList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createException
      tags: [exceptions]
      summary: Stage an availability exception (exception_added) and propose a re-solve.
      description: Local date/time fields are resolved to an absolute span using the request's X-Timezone.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExceptionDraft'}
      responses:
        '202': {$ref: '#/components/responses/ChangesetStaged'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/InternalError'}

  /exceptions/{exception_id}:
    parameters:
      - {$ref: '#/components/parameters/ExceptionId'}
      - {$ref: '#/components/parameters/XTimezone'}
    get:
      operationId: getException
      tags: [exceptions]
      responses:
        '200':
          description: The exception.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AvailabilityException'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/InternalError'}
    delete:
      operationId: deleteException
      tags: [exceptions]
      summary: Stage removal (exception_removed) and propose a re-solve.
      responses:
        '202': {$ref: '#/components/responses/ChangesetStaged'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/InternalError'}

  # ------------------------------------------------------------------ plans
  /plans/current:
    get:
      operationId: getCurrentPlan
      tags: [plans]
      summary: The live plan whose horizon contains now.
      description: The lazy sweep runs on read, so past `planned` blocks come back as `completed`.
      parameters: [{$ref: '#/components/parameters/XTimezone'}]
      responses:
        '200':
          description: Live plan with blocks (and infeasibility if the live plan was confirmed as a partial plan).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WeekPlan'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/InternalError'}

  /plans/{plan_id}/diff:
    get:
      operationId: getPlanDiff
      tags: [plans]
      summary: Per-lineage diff of plan `plan_id` (after) against plan `against` (before).
      parameters:
        - {$ref: '#/components/parameters/PlanId'}
        - {$ref: '#/components/parameters/XTimezone'}
        - name: against
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: The diff, one entry per lineage present in either plan.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanDiff'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/InternalError'}

  # ------------------------------------------------------------------ blocks
  /blocks/{block_id}:
    patch:
      operationId: patchBlock
      tags: [blocks]
      summary: Act on a block of the live plan.
      description: |
        - `complete` / `skip`: flip `state` on a started (past or in-progress) block. Applied
          immediately, no re-solve. Returns 200 + Block. Idempotent.
        - `edit`: user drag/resize. Stages `pin_added` (kind=pin, this block's project, the new
          absolute span) and proposes a re-solve. Returns 202 + Changeset.
        - `delete`: stages `pin_added` (kind=forbid, this block's project, the block's span) and
          proposes a re-solve. Returns 202 + Changeset.
        Blocks are never edited in place; only confirm promotes solver output.
      parameters:
        - {$ref: '#/components/parameters/BlockId'}
        - {$ref: '#/components/parameters/XTimezone'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BlockAction'}
      responses:
        '200':
          description: complete/skip applied.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Block'}
        '202': {$ref: '#/components/responses/ChangesetStaged'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/InternalError'}

  # ------------------------------------------------------------------ pins
  /pins:
    get:
      operationId: listPins
      tags: [pins]
      summary: List the user's block_pins (pins and forbids). Addition beyond ARCH §7 (TECH_SPEC T2.3).
      description: No POST — pins are created only by PATCH /blocks (edit → pin, delete → forbid) or the agent's stage_pin tool.
      parameters:
        - {$ref: '#/components/parameters/XTimezone'}
        - name: include_past
          in: query
          required: false
          description: Include pins whose span ended before now.
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Pins ordered by span start ascending (no pagination in v1).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PinList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/InternalError'}

  /pins/{pin_id}:
    delete:
      operationId: deletePin
      tags: [pins]
      summary: Stage removal (pin_removed) and propose a re-solve. Addition beyond ARCH §7 (TECH_SPEC T2.3).
      parameters:
        - {$ref: '#/components/parameters/PinId'}
        - {$ref: '#/components/parameters/XTimezone'}
      responses:
        '202': {$ref: '#/components/responses/ChangesetStaged'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/InternalError'}

  # ------------------------------------------------------------------ todos
  # Standalone tracking (Todos v1). Direct CRUD: no changeset, no solve, no mutations row.
  /todos:
    get:
      operationId: listTodos
      tags: [todos]
      summary: The user's todos plus the current period starts.
      parameters:
        - {$ref: '#/components/parameters/XTimezone'}
        - name: include_done
          in: query
          required: false
          description: Return every done one-off. Default returns only one-offs completed in the last 7 days.
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Todos (no pagination in v1). `periods` holds the current daily and weekly period starts.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TodoList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createTodo
      tags: [todos]
      summary: Create a todo, placed last in its kind.
      parameters: [{$ref: '#/components/parameters/XTimezone'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TodoDraft'}
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Todo'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/InternalError'}

  /todos/order:
    put:
      operationId: reorderTodos
      tags: [todos]
      summary: Set the manual order within one kind.
      description: |
        `ids` must be exactly the open todos of that kind, in the new order (422 `invalid_order` otherwise).
        Daily and weekly: every todo of the kind. One-off: only those with `completed_at` null. Done
        one-offs are not listed; they keep their position.
      parameters: [{$ref: '#/components/parameters/XTimezone'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TodoOrder'}
      responses:
        '200':
          description: All todos, as in listTodos.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TodoList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/InternalError'}

  /todos/{todo_id}:
    parameters:
      - {$ref: '#/components/parameters/TodoId'}
      - {$ref: '#/components/parameters/XTimezone'}
    patch:
      operationId: updateTodo
      tags: [todos]
      summary: Partial update. `kind` is immutable.
      description: |
        `done` applies to one-offs only (sets or clears `completed_at`). Setting `done`, or a
        non-null `due_date`, on a recurring todo is 409 `todo_recurring`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TodoPatch'}
      responses:
        '200':
          description: The updated todo.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Todo'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/InternalError'}
    delete:
      operationId: deleteTodo
      tags: [todos]
      summary: Hard delete. Completions cascade.
      responses:
        '204': {description: Deleted.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/InternalError'}

  /todos/{todo_id}/completions/{period_start}:
    parameters:
      - {$ref: '#/components/parameters/TodoId'}
      - {$ref: '#/components/parameters/PeriodStart'}
      - {$ref: '#/components/parameters/XTimezone'}
    put:
      operationId: completeTodoPeriod
      tags: [todos]
      summary: Tick a recurring todo for one period. Idempotent.
      description: '`period_start` must be the current or previous period start for the todo''s kind (422 `invalid_period` otherwise).'
      responses:
        '200':
          description: The todo, with `completed_periods` updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Todo'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/InternalError'}
    delete:
      operationId: uncompleteTodoPeriod
      tags: [todos]
      summary: Untick a recurring todo for one period. Idempotent.
      responses:
        '200':
          description: The todo, with `completed_periods` updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Todo'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/InternalError'}

  # ------------------------------------------------------------------ agent
  /agent/message:
    post:
      operationId: postAgentMessage
      tags: [agent]
      summary: One agent turn. Client sends the full transcript; response is an SSE stream.
      description: |
        Stateless: the server holds no chat. Pre-stream failures (auth, validation) are normal
        JSON error responses. Once `200` is sent, failures arrive as an `error` event. Exactly
        one terminal event (`done` or `error`) ends every stream. See NOTES.md "SSE".
      parameters: [{$ref: '#/components/parameters/XTimezone'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentMessageRequest'}
      responses:
        '200':
          description: SSE stream of AgentStreamEvent frames (`event:` name + JSON `data:`).
          content:
            text/event-stream:
              schema:
                type: string
                description: 'Each frame is `event: <name>` + `data: <json>` + blank line. Parsed frames conform to AgentStreamEvent.'
              x-sse-event-schema: {$ref: '#/components/schemas/AgentStreamEvent'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/InternalError'}

  # ------------------------------------------------------------------ changesets
  /changesets/{changeset_id}/confirm:
    post:
      operationId: confirmChangeset
      tags: [changesets]
      summary: Apply staged mutations and promote the proposed plan to live (one transaction).
      description: |
        Idempotent: confirming an already-`confirmed` changeset returns 200 with the same body.
        A `rejected` or `expired` changeset returns 409 `changeset_not_pending`.
      parameters:
        - {$ref: '#/components/parameters/ChangesetId'}
        - {$ref: '#/components/parameters/XTimezone'}
      responses:
        '200':
          description: Confirmed. `plan` (if any) now has status `live`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Changeset'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/InternalError'}

  /changesets/{changeset_id}/reject:
    post:
      operationId: rejectChangeset
      tags: [changesets]
      summary: Discard the changeset; constraint state untouched; proposed plan → rejected.
      description: |
        Idempotent: rejecting an already-`rejected` changeset returns 200 with the same body.
        A `confirmed` or `expired` changeset returns 409 `changeset_not_pending`.
      parameters:
        - {$ref: '#/components/parameters/ChangesetId'}
        - {$ref: '#/components/parameters/XTimezone'}
      responses:
        '200':
          description: Rejected.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Changeset'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/InternalError'}

  # ------------------------------------------------------------------ gcal
  /gcal/connect:
    get:
      operationId: getGcalConnectUrl
      tags: [gcal]
      summary: Build the Google OAuth URL (PKCE + signed state bound to the session's user).
      description: Returns JSON rather than a 302 because ASWebAuthenticationSession cannot attach the bearer header.
      parameters: [{$ref: '#/components/parameters/XTimezone'}]
      responses:
        '200':
          description: Open `authorization_url` in ASWebAuthenticationSession.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GcalConnectUrl'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/InternalError'}

  /gcal/callback:
    get:
      operationId: gcalCallback
      tags: [gcal]
      summary: Google OAuth redirect target (hit by the browser, not the app's API client).
      description: |
        Unauthenticated; always answers with a 302 to the app callback URL. Exchanges nothing
        and persists nothing (D24, 2026-11-15 T4.1 review): on success it hands Google's code
        and the state back to the app (`result=authorized&auth_code=…&state=…`, both
        URL-encoded), and the app finishes with its bearer via POST /gcal/complete.
        Shared with Google sign-in (T6.0, D26): a sign-in (`login`) state is sent to
        `reclaimmytime://auth/google/callback` instead, with the same `result`/`code`
        parameters, and the app finishes via POST /auth/google/complete. A state too broken
        to read its purpose goes to the connect URL (`reclaimmytime://gcal/callback`).
        `error=access_denied` → `gcal_access_denied`; any other Google `error`, or no `code` →
        `gcal_exchange_failed`; a missing, undecryptable or expired `state` →
        `gcal_state_invalid` (state is decrypted and its expiry checked; no DB access).
      security: []
      parameters:
        - {name: state, in: query, required: true, schema: {type: string, minLength: 1}}
        - {name: code, in: query, required: false, schema: {type: string, minLength: 1}}
        - {name: error, in: query, required: false, description: Set by Google on denial (e.g. access_denied)., schema: {type: string}}
        - {name: scope, in: query, required: false, schema: {type: string}}
      responses:
        '302':
          description: Redirect back into the app.
          headers:
            Location:
              required: true
              schema:
                type: string
                pattern: '^reclaimmytime://(gcal|auth/google)/callback\?result=(authorized&auth_code=[^&#]+&state=[^&#]+|error&code=[a-z_]+)$'
        default: {$ref: '#/components/responses/InternalError'}

  /gcal/complete:
    post:
      operationId: completeGcalConnect
      tags: [gcal]
      summary: Finish the Google connect flow as the bearer holder (D24, 2026-11-15 T4.1 review).
      description: |
        Body carries the `auth_code` and `state` from the `result=authorized` callback
        redirect. The state must decrypt, be unexpired, and have been issued to this same
        bearer user; then the server exchanges the code (PKCE), checks the granted scopes,
        the refresh token and the id_token, and stores the connection. Errors:
        400 `gcal_state_invalid` (bad, expired, or another user's state, or a sign-in state —
        not distinguished), 422 `gcal_scope_insufficient`, 502 `gcal_exchange_failed`.
      parameters: [{$ref: '#/components/parameters/XTimezone'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GcalCompleteRequest'}
      responses:
        '200':
          description: Connected; the stored connection.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GcalStatus'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '502': {$ref: '#/components/responses/BadGateway'}
        default: {$ref: '#/components/responses/InternalError'}

  /gcal/status:
    get:
      operationId: getGcalStatus
      tags: [gcal]
      summary: Google connection state (addition beyond ARCH §7; see NOTES.md).
      parameters: [{$ref: '#/components/parameters/XTimezone'}]
      responses:
        '200':
          description: '`connection` is null when never connected or after disconnect.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GcalStatus'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/InternalError'}

  /gcal/sync:
    post:
      operationId: syncGcal
      tags: [gcal]
      summary: Sync with Google Calendar and fetch the pending changeset (2026-11-16, T4.3; NOTES D25).
      description: |
        Call on app foreground and from BGAppRefreshTask. No request body.

        1. Drains this user's write-back outbox (live blocks → events in the app calendar),
           waiting at most ~10 s overall. Whatever remains stays pending (retried by the next
           confirm or sync), and the response still returns.
        2. (2026-11-16, T4.3b) Ingests edits the user made to our events inside Google
           Calendar: a move becomes a pin, a delete a forbid. When nothing else has to move,
           the edit goes live directly; otherwise the knock-on re-solve is proposed as a
           `google_edit` changeset (NOTES D25). Then the drift check: live blocks that have not
           started and now overlap calendar busy time → a `drift` changeset. Neither replaces
           a changeset that is already pending.
        3. Returns the user's current pending changeset, if any (resolves O2), and the outbox
           counts.

        Never connected (or disconnected): 200 with `outbox` all zeros; nothing is written
        and `pending_changeset` is still returned. Errors: 409 `gcal_reconnect_required`
        (connection revoked, or its credential undecryptable: reconnect via GET /gcal/connect),
        503 `gcal_unavailable` (Google failed during the drain, the edit ingest or the busy
        read; what was written stays written, the rest stays pending, and no Google edit is
        applied when the busy read fails; retry later). 2026-11-16 (T4.3b): the same two
        errors now also come from the ingest and drift steps.
        2026-11-25 (issue #22): 503 `solver_timeout` when a solve in the ingest or drift step
        runs out of time; nothing from those steps is applied or staged, what the drain wrote
        stays written; retry.
      parameters: [{$ref: '#/components/parameters/XTimezone'}]
      responses:
        '200':
          description: Synced as far as the time budget allowed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GcalSyncResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/InternalError'}

  /gcal:
    delete:
      operationId: disconnectGcal
      tags: [gcal]
      summary: Revoke the Google grant and delete the connection row (addition beyond ARCH §7).
      parameters: [{$ref: '#/components/parameters/XTimezone'}]
      responses:
        '204': {description: Disconnected.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/InternalError'}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Opaque 256-bit session token from POST /auth/google/complete or POST /auth/apple (`Authorization: Bearer <token>`). Not a JWT.'

  parameters:
    XTimezone:
      name: X-Timezone
      in: header
      required: true
      description: Device IANA timezone, sent on every authenticated request (ARCH §3 Semantics).
      schema: {$ref: '#/components/schemas/IanaTimezone'}
    XTimezoneIgnored:
      name: X-Timezone
      in: header
      required: false
      description: Optional and ignored on the unauthenticated sign-in routes (T6.0, D26); declared so a client that sends it on every request conforms. Any value is accepted, so it is not validated as IanaTimezone.
      schema: {type: string}
    ProjectId:
      {name: project_id, in: path, required: true, schema: {type: string, format: uuid}}
    ExceptionId:
      {name: exception_id, in: path, required: true, schema: {type: string, format: uuid}}
    PlanId:
      {name: plan_id, in: path, required: true, schema: {type: string, format: uuid}}
    BlockId:
      {name: block_id, in: path, required: true, schema: {type: string, format: uuid}}
    PinId:
      {name: pin_id, in: path, required: true, schema: {type: string, format: uuid}}
    TodoId:
      {name: todo_id, in: path, required: true, schema: {type: string, format: uuid}}
    PeriodStart:
      name: period_start
      in: path
      required: true
      description: Local period start. Daily is the local date; weekly is the start of the week per preferences.week_start.
      schema: {type: string, format: date}
    ChangesetId:
      {name: changeset_id, in: path, required: true, schema: {type: string, format: uuid}}

  responses:
    ChangesetStaged:
      description: Staged. Nothing applied until POST /changesets/{id}/confirm.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Changeset'}
    BadRequest:
      description: Malformed request (e.g. missing/invalid X-Timezone).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Missing/invalid/expired session, or invalid Apple credential.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Resource does not exist or belongs to another user.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: Request conflicts with current state (see code).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ValidationFailed:
      description: Body failed schema or semantic validation.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    TooManyRequests:
      description: |
        A per-user limit refused the request. On `POST /agent/message`, an agent limit before the stream started (`agent_budget_exceeded`, `agent_turn_in_progress`). On the scheduling write endpoints, the per-user write rate limit (`rate_limited`), with `Retry-After`; nothing was staged or applied. See NOTES.md.
      headers:
        Retry-After:
          description: Seconds until the write rate window ends and a retry can succeed. Sent with `rate_limited` only.
          required: false
          schema:
            anyOf:
              - {type: integer, minimum: 1}
              - {type: string, pattern: '^[1-9][0-9]*$'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    BadGateway:
      description: An upstream (Google) answered with an error or could not be reached (e.g. gcal_exchange_failed).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ServiceUnavailable:
      description: Upstream dependency (LLM, Google) unavailable before the stream started.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InternalError:
      description: Unexpected error.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}

  schemas:
    # ---------------------------------------------------------------- primitives
    Uuid: {type: string, format: uuid}
    IanaTimezone:
      type: string
      description: IANA tz database name, e.g. America/Los_Angeles. Validated server-side against tzdata.
      pattern: '^[A-Za-z][A-Za-z0-9_+\-]*(/[A-Za-z0-9_+\-]+)*$'
      maxLength: 64
    LocalTime:
      type: string
      description: Local wall-clock time HH:MM (24h). "24:00" is allowed only as a window end.
      pattern: '^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$'
    Tag:
      type: string
      description: A requirement tag from the user's controlled vocabulary (user_tags.tag).
      minLength: 1
      maxLength: 40
    TagList:
      type: array
      description: |
        Unique tags. At most 20 on writes (REST bodies and agent tool calls); rows stored
        before the cap are still served as they are.
      items: {$ref: '#/components/schemas/Tag'}
      uniqueItems: true
      maxItems: 20
    Span:
      type: object
      description: |
        tstzrange mapping. Half-open [start, end), start < end, both RFC 3339 with offset.
        Server emits UTC ("Z"). Used for blocks.span, availability_exceptions.span,
        block_pins.span, week_plans.horizon.
      required: [start, end]
      additionalProperties: false
      properties:
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
    TimeWindow:
      type: array
      description: '[start, end) local times on one day; start < end; no midnight crossing.'
      prefixItems:
        - {$ref: '#/components/schemas/LocalTime'}
        - {$ref: '#/components/schemas/LocalTime'}
      items: false
      minItems: 2
      maxItems: 2
    DayWindows:
      type: array
      description: |
        Sorted, non-overlapping windows for one weekday. At most 10 on writes (REST bodies and
        agent tool calls); rows stored before the cap are still served as they are.
      items: {$ref: '#/components/schemas/TimeWindow'}
      maxItems: 10
    WeekWindows:
      type: object
      description: |
        jsonb weekly windows, local wall-clock, keyed mon..sun. An absent key is equivalent to []
        (no window that day).
      additionalProperties: false
      properties:
        mon: {$ref: '#/components/schemas/DayWindows'}
        tue: {$ref: '#/components/schemas/DayWindows'}
        wed: {$ref: '#/components/schemas/DayWindows'}
        thu: {$ref: '#/components/schemas/DayWindows'}
        fri: {$ref: '#/components/schemas/DayWindows'}
        sat: {$ref: '#/components/schemas/DayWindows'}
        sun: {$ref: '#/components/schemas/DayWindows'}

    # ---------------------------------------------------------------- enums (verbatim DDL)
    ConnectionStatus: {type: string, enum: [active, revoked]}
    ProjectKind: {type: string, enum: [deadline, perennial]}
    ProjectStatus:
      type: string
      enum: [staged, active, paused, done, archived]
      description: staged = inserted by a pending project_created mutation (O1); visible only inside its Changeset, never in list/get (D23).
    DayDiversity: {type: string, enum: [focused, mixed]}
    PinKind: {type: string, enum: [pin, forbid]}
    PlanStatus: {type: string, enum: [proposed, live, superseded, rejected]}
    ChangesetStatus: {type: string, enum: [pending, confirmed, rejected, expired]}
    ChangesetReason:
      type: string
      description: |
        Why the changeset was proposed (2026-11-16, T4.3; NOTES D25). `user_edit`: a REST
        staged write (projects, preferences, exceptions, pins, block edit/delete). `agent`:
        an agent turn (POST /agent/message). `drift`: calendar busy time now overlaps live
        blocks; the server re-solved with no constraint change (`staged` may be empty).
        `google_edit`: one of our events was edited inside Google Calendar (2026-11-16, T4.3b).
        `staged` carries the resulting pin(s) when nothing was applied; it is empty when the
        user's pin/forbid was already applied directly and only the knock-on re-solve is
        proposed. Rejecting a `google_edit` changeset that carries pins (nothing applied yet)
        writes our planned times back over the user's events in Google; rejecting an empty one
        only declines the knock-on, and the user's edit stays live (2026-11-16, T4.3b review). A stale re-proposal (409 `changeset_stale`) keeps the reason
        of the changeset it replaces. Clients decode this enum strictly (as every other enum
        while contracts/ is frozen): a new value ships with a client update.
      enum: [user_edit, agent, drift, google_edit]
    BlockState: {type: string, enum: [planned, completed, skipped]}
    GcalSync: {type: string, enum: [pending, synced, failed]}
    MutationSource: {type: string, enum: [agent, manual, system]}
    MutationKind:
      type: string
      enum: [project_created, project_updated, project_archived, preferences_updated,
             exception_added, exception_removed, pin_added, pin_removed,
             plan_proposed, plan_confirmed, plan_rejected]

    # ---------------------------------------------------------------- errors
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error: {$ref: '#/components/schemas/ErrorBody'}
    ErrorBody:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          description: Stable machine code; full list in NOTES.md. Clients must tolerate unknown codes.
          pattern: '^[a-z][a-z0-9_]*$'
        message: {type: string, description: Human-readable; not for display logic.}
        details:
          type: object
          description: Code-specific structured data (e.g. `fields` for validation_failed).
          additionalProperties: true

    # ---------------------------------------------------------------- auth
    AppleSignInRequest:
      type: object
      required: [identity_token, authorization_code, nonce]
      additionalProperties: false
      properties:
        identity_token: {type: string, minLength: 1, description: Apple identity token (JWT) from ASAuthorizationAppleIDCredential.}
        authorization_code: {type: string, minLength: 1, description: One-time code; exchanged server-side for Apple's refresh token.}
        nonce: {type: string, minLength: 16, description: The raw nonce; the token's nonce claim must equal its SHA-256 hex digest.}
    GoogleSignInStartRequest:
      type: object
      description: T6.0, D26.
      required: [nonce_hash]
      additionalProperties: false
      properties:
        nonce_hash:
          type: string
          description: base64url(SHA-256(nonce)) without padding (43 chars) of a random nonce the app keeps until POST /auth/google/complete.
          pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
    GoogleSignInCompleteRequest:
      type: object
      description: From the `result=authorized` sign-in callback redirect, URL-decoded, plus the app's raw nonce (T6.0, D26).
      required: [auth_code, state, nonce]
      additionalProperties: false
      properties:
        auth_code: {type: string, minLength: 1}
        state: {type: string, minLength: 1}
        nonce: {type: string, minLength: 16, maxLength: 512, description: The raw nonce whose hash was sent to POST /auth/google/start.}
    User:
      type: object
      required: [id, email, created_at]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        email:
          type: [string, 'null']
          format: email
          description: Null unless the sign-in provider reported a verified address (Apple, not private relay; Google, email_verified) that no other user holds.
        created_at: {type: string, format: date-time}
    Session:
      type: object
      required: [id, created_at, expires_at]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time, description: Sliding (30d), capped at 180d from created_at.}
    AuthSession:
      type: object
      required: [token, session, user, is_new_user]
      additionalProperties: false
      properties:
        token: {type: string, minLength: 32, description: Opaque bearer token. Shown once; store in Keychain.}
        session: {$ref: '#/components/schemas/Session'}
        user: {$ref: '#/components/schemas/User'}
        is_new_user: {type: boolean}
    GoogleAuthSession:
      type: object
      description: AuthSession plus `gcal_connected` (T6.0, D26).
      required: [token, session, user, is_new_user, gcal_connected]
      additionalProperties: false
      properties:
        token: {type: string, minLength: 32, description: Opaque bearer token. Shown once; store in Keychain.}
        session: {$ref: '#/components/schemas/Session'}
        user: {$ref: '#/components/schemas/User'}
        is_new_user: {type: boolean}
        gcal_connected: {type: boolean, description: 'The user has an active Google Calendar connection after this sign-in: the one just stored, or (calendar scopes not granted) one that already existed. False → show the connect prompt.'}

    # ---------------------------------------------------------------- projects
    Project:
      description: projects row (user_id omitted). Discriminated on kind; the other kind's fields are present and null.
      oneOf:
        - {$ref: '#/components/schemas/DeadlineProject'}
        - {$ref: '#/components/schemas/PerennialProject'}
      discriminator:
        propertyName: kind
        mapping:
          deadline: '#/components/schemas/DeadlineProject'
          perennial: '#/components/schemas/PerennialProject'
    DeadlineProject:
      type: object
      required: [id, name, kind, target_date, estimated_total_hours, weekly_target_hours,
                 max_block_minutes, min_block_minutes, preferred_windows, preferred_strict,
                 requirements, status, created_at]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 200}
        kind: {const: deadline}
        target_date: {type: string, format: date, description: Local date; deadline is the end of that local day.}
        estimated_total_hours: {$ref: '#/components/schemas/EstimatedTotalHours'}
        weekly_target_hours: {type: 'null'}
        max_block_minutes: {type: integer, minimum: 1}
        min_block_minutes: {type: integer, minimum: 1}
        preferred_windows:
          oneOf: [{$ref: '#/components/schemas/WeekWindows'}, {type: 'null'}]
        preferred_strict: {type: boolean}
        requirements: {$ref: '#/components/schemas/TagList'}
        status: {$ref: '#/components/schemas/ProjectStatus'}
        created_at: {type: string, format: date-time}
    PerennialProject:
      type: object
      required: [id, name, kind, target_date, estimated_total_hours, weekly_target_hours,
                 max_block_minutes, min_block_minutes, preferred_windows, preferred_strict,
                 requirements, status, created_at]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 200}
        kind: {const: perennial}
        target_date: {type: 'null'}
        estimated_total_hours: {type: 'null'}
        weekly_target_hours: {$ref: '#/components/schemas/WeeklyTargetHours'}
        max_block_minutes: {type: integer, minimum: 1}
        min_block_minutes: {type: integer, minimum: 1}
        preferred_windows:
          oneOf: [{$ref: '#/components/schemas/WeekWindows'}, {type: 'null'}]
        preferred_strict: {type: boolean}
        requirements: {$ref: '#/components/schemas/TagList'}
        status: {$ref: '#/components/schemas/ProjectStatus'}
        created_at: {type: string, format: date-time}
    EstimatedTotalHours:
      type: number
      description: numeric(6,1). One decimal place; server rounds half-even to 0.1.
      exclusiveMinimum: 0
      maximum: 99999.9
    WeeklyTargetHours:
      type: number
      description: numeric(5,1). One decimal place; server rounds half-even to 0.1.
      exclusiveMinimum: 0
      maximum: 168
    ProjectList:
      type: object
      required: [projects]
      additionalProperties: false
      properties:
        projects:
          type: array
          items: {$ref: '#/components/schemas/Project'}

    ProjectDraft:
      description: |
        ARCH §5 ProjectDraft — request body for POST /projects and the agent's stage_project tool.
        Local dates only. Deadline/perennial XOR encoded as oneOf on kind (mirrors the DB CHECK).
        min_block_minutes defaults to min(25, max_block_minutes); must be <= max_block_minutes.
      oneOf:
        - {$ref: '#/components/schemas/DeadlineProjectDraft'}
        - {$ref: '#/components/schemas/PerennialProjectDraft'}
      discriminator:
        propertyName: kind
        mapping:
          deadline: '#/components/schemas/DeadlineProjectDraft'
          perennial: '#/components/schemas/PerennialProjectDraft'
    DeadlineProjectDraft:
      type: object
      required: [name, kind, target_date, estimated_total_hours, max_block_minutes]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        kind: {const: deadline}
        target_date: {type: string, format: date}
        estimated_total_hours: {$ref: '#/components/schemas/EstimatedTotalHours'}
        max_block_minutes: {type: integer, minimum: 1}
        min_block_minutes: {type: integer, minimum: 1}
        preferred_windows:
          oneOf: [{$ref: '#/components/schemas/WeekWindows'}, {type: 'null'}]
        preferred_strict: {type: boolean, default: false}
        requirements: {$ref: '#/components/schemas/TagList'}
    PerennialProjectDraft:
      type: object
      required: [name, kind, weekly_target_hours, max_block_minutes]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        kind: {const: perennial}
        weekly_target_hours: {$ref: '#/components/schemas/WeeklyTargetHours'}
        max_block_minutes: {type: integer, minimum: 1}
        min_block_minutes: {type: integer, minimum: 1}
        preferred_windows:
          oneOf: [{$ref: '#/components/schemas/WeekWindows'}, {type: 'null'}]
        preferred_strict: {type: boolean, default: false}
        requirements: {$ref: '#/components/schemas/TagList'}
    ProjectPatch:
      type: object
      description: |
        Partial update. `kind` is immutable. Sending a field of the other kind (e.g.
        weekly_target_hours on a deadline project) is 422. `preferred_windows: null` clears.
      minProperties: 1
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        target_date: {type: string, format: date}
        estimated_total_hours: {$ref: '#/components/schemas/EstimatedTotalHours'}
        weekly_target_hours: {$ref: '#/components/schemas/WeeklyTargetHours'}
        max_block_minutes: {type: integer, minimum: 1}
        min_block_minutes: {type: integer, minimum: 1}
        preferred_windows:
          oneOf: [{$ref: '#/components/schemas/WeekWindows'}, {type: 'null'}]
        preferred_strict: {type: boolean}
        requirements: {$ref: '#/components/schemas/TagList'}
        status: {type: string, enum: [active, paused, done], description: archived is set only via DELETE.}

    # ---------------------------------------------------------------- preferences
    UserPreferences:
      type: object
      description: user_preferences row (user_id omitted). Also the full-replacement PUT body (ARCH §5 PreferencesDraft).
      required: [timezone, schedulable_windows, day_diversity, buffer_minutes, week_start]
      additionalProperties: false
      properties:
        timezone: {$ref: '#/components/schemas/IanaTimezone'}
        schedulable_windows: {$ref: '#/components/schemas/WeekWindows'}
        day_diversity: {$ref: '#/components/schemas/DayDiversity'}
        buffer_minutes: {type: integer, minimum: 0, maximum: 240}
        week_start: {type: integer, minimum: 1, maximum: 7, description: ISO-8601 weekday, 1 = Monday … 7 = Sunday.}

    # ---------------------------------------------------------------- exceptions
    AvailabilityException:
      type: object
      description: availability_exceptions row (user_id omitted). span is absolute.
      required: [id, span, blocks_all, blocks_tags, reason, created_at]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        span: {$ref: '#/components/schemas/Span'}
        blocks_all: {type: boolean}
        blocks_tags: {$ref: '#/components/schemas/TagList'}
        reason: {type: [string, 'null'], maxLength: 500}
        created_at: {type: string, format: date-time}
      anyOf:
        - {properties: {blocks_all: {const: true}}}
        - {properties: {blocks_tags: {minItems: 1}}}
    AvailabilityExceptionList:
      type: object
      required: [exceptions]
      additionalProperties: false
      properties:
        exceptions:
          type: array
          items: {$ref: '#/components/schemas/AvailabilityException'}
    ExceptionDraft:
      type: object
      description: |
        ARCH §5 ExceptionDraft — local dates/times only, resolved with X-Timezone.
        Omitted start_time = 00:00 of start_date; omitted end_time = end of end_date (next day 00:00).
        Requires blocks_all=true or ≥1 blocks_tags (DB CHECK).
      required: [start_date, end_date]
      additionalProperties: false
      properties:
        start_date: {type: string, format: date}
        start_time: {$ref: '#/components/schemas/LocalTime'}
        end_date: {type: string, format: date}
        end_time: {$ref: '#/components/schemas/LocalTime'}
        blocks_all: {type: boolean, default: false}
        blocks_tags: {$ref: '#/components/schemas/TagList'}
        reason: {type: [string, 'null'], maxLength: 500}
      anyOf:
        - {required: [blocks_all], properties: {blocks_all: {const: true}}}
        - {required: [blocks_tags], properties: {blocks_tags: {minItems: 1}}}

    # ---------------------------------------------------------------- plans & blocks
    Block:
      type: object
      description: blocks row (user_id, gcal_etag omitted).
      required: [id, plan_id, project_id, lineage_id, span, state, gcal_status, gcal_event_id]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        plan_id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        lineage_id: {type: string, format: uuid, description: Stable across plan versions; the diff key.}
        span: {$ref: '#/components/schemas/Span'}
        state: {$ref: '#/components/schemas/BlockState'}
        gcal_status: {$ref: '#/components/schemas/GcalSync'}
        gcal_event_id: {type: [string, 'null']}
    WeekPlan:
      type: object
      description: week_plans row (user_id, solver_input omitted) + its blocks ordered by span.start.
      required: [id, horizon, week_start, timezone, version, status, infeasibility, created_at, superseded_at, blocks]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        horizon: {$ref: '#/components/schemas/Span'}
        week_start: {type: string, format: date}
        timezone: {$ref: '#/components/schemas/IanaTimezone'}
        version: {type: integer, minimum: 1}
        status: {$ref: '#/components/schemas/PlanStatus'}
        infeasibility:
          oneOf: [{$ref: '#/components/schemas/Infeasibility'}, {type: 'null'}]
        created_at: {type: string, format: date-time}
        superseded_at: {type: [string, 'null'], format: date-time}
        blocks:
          type: array
          items: {$ref: '#/components/schemas/Block'}

    Infeasibility:
      type: object
      description: |
        ARCH §4 SolverOutput.infeasibility. The plan carrying it is the best partial plan.
        Relaxations are candidates for the user to pick (PRD Principle 2); picking one is a new
        staged write (e.g. PATCH /projects), never automatic.
      required: [violations, relaxations]
      additionalProperties: false
      properties:
        violations:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/Violation'}
        relaxations:
          type: array
          items: {$ref: '#/components/schemas/Relaxation'}
    Violation:
      oneOf:
        - {$ref: '#/components/schemas/DemandShortfall'}
        - {$ref: '#/components/schemas/PinInvalidated'}
      discriminator:
        propertyName: kind
        mapping:
          demand_shortfall: '#/components/schemas/DemandShortfall'
          pin_invalidated: '#/components/schemas/PinInvalidated'
    DemandShortfall:
      type: object
      description: A project's required minutes in this horizon could not all be placed.
      required: [kind, project_id, required_minutes, scheduled_minutes, shortfall_minutes]
      additionalProperties: false
      properties:
        kind: {const: demand_shortfall}
        project_id: {type: string, format: uuid}
        required_minutes: {type: integer, minimum: 0}
        scheduled_minutes: {type: integer, minimum: 0}
        shortfall_minutes: {type: integer, minimum: 1}
    PinInvalidated:
      type: object
      description: A pin/forbid that verify() rejects (calendar > exceptions > pins; plus structural checks — O6). Reported, never dropped. Pinned blocks are exempt from block_length only.
      required: [kind, pin_id, pin_kind, project_id, span, conflicts_with, exception_id, related_lineage_ids]
      additionalProperties: false
      properties:
        kind: {const: pin_invalidated}
        pin_id: {type: string, format: uuid}
        pin_kind: {$ref: '#/components/schemas/PinKind'}
        project_id: {type: [string, 'null'], format: uuid}
        span: {$ref: '#/components/schemas/Span'}
        conflicts_with: {type: string, enum: [busy, exception, window, buffer, overlap, forbid, horizon, before_now, preferred_window]}
        exception_id: {type: [string, 'null'], format: uuid, description: Set when conflicts_with = exception.}
        related_lineage_ids: {type: array, items: {type: string, format: uuid}, description: The other block(s) involved when conflicts_with is overlap or buffer; empty otherwise.}
    Relaxation:
      oneOf:
        - {$ref: '#/components/schemas/RelaxExtendDeadline'}
        - {$ref: '#/components/schemas/RelaxReduceEstimate'}
        - {$ref: '#/components/schemas/RelaxReduceWeeklyTarget'}
        - {$ref: '#/components/schemas/RelaxRaiseMaxBlock'}
        - {$ref: '#/components/schemas/RelaxPauseProject'}
        - {$ref: '#/components/schemas/RelaxRemovePin'}
        - {$ref: '#/components/schemas/RelaxRemoveException'}
      discriminator:
        propertyName: kind
        mapping:
          extend_deadline: '#/components/schemas/RelaxExtendDeadline'
          reduce_estimate: '#/components/schemas/RelaxReduceEstimate'
          reduce_weekly_target: '#/components/schemas/RelaxReduceWeeklyTarget'
          raise_max_block_minutes: '#/components/schemas/RelaxRaiseMaxBlock'
          pause_project: '#/components/schemas/RelaxPauseProject'
          remove_pin: '#/components/schemas/RelaxRemovePin'
          remove_exception: '#/components/schemas/RelaxRemoveException'
    RelaxExtendDeadline:
      type: object
      required: [kind, recovers_minutes, project_id, target_date]
      additionalProperties: false
      properties:
        kind: {const: extend_deadline}
        recovers_minutes: {type: integer, minimum: 1, description: Shortfall minutes this relaxation would eliminate.}
        project_id: {type: string, format: uuid}
        target_date: {type: string, format: date, description: Proposed new target_date.}
    RelaxReduceEstimate:
      type: object
      required: [kind, recovers_minutes, project_id, estimated_total_hours]
      additionalProperties: false
      properties:
        kind: {const: reduce_estimate}
        recovers_minutes: {type: integer, minimum: 1}
        project_id: {type: string, format: uuid}
        estimated_total_hours: {$ref: '#/components/schemas/EstimatedTotalHours'}
    RelaxReduceWeeklyTarget:
      type: object
      required: [kind, recovers_minutes, project_id, weekly_target_hours]
      additionalProperties: false
      properties:
        kind: {const: reduce_weekly_target}
        recovers_minutes: {type: integer, minimum: 1}
        project_id: {type: string, format: uuid}
        weekly_target_hours: {$ref: '#/components/schemas/WeeklyTargetHours'}
    RelaxRaiseMaxBlock:
      type: object
      required: [kind, recovers_minutes, project_id, max_block_minutes]
      additionalProperties: false
      properties:
        kind: {const: raise_max_block_minutes}
        recovers_minutes: {type: integer, minimum: 1}
        project_id: {type: string, format: uuid}
        max_block_minutes: {type: integer, minimum: 1}
    RelaxPauseProject:
      type: object
      required: [kind, recovers_minutes, project_id]
      additionalProperties: false
      properties:
        kind: {const: pause_project}
        recovers_minutes: {type: integer, minimum: 1}
        project_id: {type: string, format: uuid}
    RelaxRemovePin:
      type: object
      required: [kind, recovers_minutes, pin_id]
      additionalProperties: false
      properties:
        kind: {const: remove_pin}
        recovers_minutes: {type: integer, minimum: 1}
        pin_id: {type: string, format: uuid}
    RelaxRemoveException:
      type: object
      required: [kind, recovers_minutes, exception_id]
      additionalProperties: false
      properties:
        kind: {const: remove_exception}
        recovers_minutes: {type: integer, minimum: 1}
        exception_id: {type: string, format: uuid}

    PlanDiff:
      type: object
      description: |
        One entry per lineage_id present in either plan, ordered by
        (coalesce(after.start, before.start), lineage_id). against_plan_id is null when there
        was no live plan to diff against (first week: every entry is `added`).
      required: [plan_id, against_plan_id, entries]
      additionalProperties: false
      properties:
        plan_id: {type: string, format: uuid}
        against_plan_id: {type: [string, 'null'], format: uuid}
        entries:
          type: array
          items: {$ref: '#/components/schemas/DiffEntry'}
    DiffEntry:
      description: 'moved = span changed (start and/or end; includes resize).'
      oneOf:
        - type: object
          required: [lineage_id, project_id, before, after, change]
          additionalProperties: false
          properties:
            lineage_id: {type: string, format: uuid}
            project_id: {type: string, format: uuid}
            before: {type: 'null'}
            after: {$ref: '#/components/schemas/Span'}
            change: {const: added}
        - type: object
          required: [lineage_id, project_id, before, after, change]
          additionalProperties: false
          properties:
            lineage_id: {type: string, format: uuid}
            project_id: {type: string, format: uuid}
            before: {$ref: '#/components/schemas/Span'}
            after: {type: 'null'}
            change: {const: removed}
        - type: object
          required: [lineage_id, project_id, before, after, change]
          additionalProperties: false
          properties:
            lineage_id: {type: string, format: uuid}
            project_id: {type: string, format: uuid}
            before: {$ref: '#/components/schemas/Span'}
            after: {$ref: '#/components/schemas/Span'}
            change: {enum: [moved, unchanged]}

    BlockAction:
      oneOf:
        - {$ref: '#/components/schemas/BlockComplete'}
        - {$ref: '#/components/schemas/BlockSkip'}
        - {$ref: '#/components/schemas/BlockEdit'}
        - {$ref: '#/components/schemas/BlockDelete'}
      discriminator:
        propertyName: action
        mapping:
          complete: '#/components/schemas/BlockComplete'
          skip: '#/components/schemas/BlockSkip'
          edit: '#/components/schemas/BlockEdit'
          delete: '#/components/schemas/BlockDelete'
    BlockComplete:
      type: object
      required: [action]
      additionalProperties: false
      properties:
        action: {const: complete}
    BlockSkip:
      type: object
      required: [action]
      additionalProperties: false
      properties:
        action: {const: skip}
    BlockEdit:
      type: object
      description: Manual drag/resize. Absolute span (the one place a client sends absolute times). Must start after now and lie within the plan horizon.
      required: [action, span]
      additionalProperties: false
      properties:
        action: {const: edit}
        span: {$ref: '#/components/schemas/Span'}
    BlockDelete:
      type: object
      required: [action]
      additionalProperties: false
      properties:
        action: {const: delete}

    BlockPin:
      type: object
      description: block_pins row (user_id omitted). project_id null only for a blanket forbid.
      required: [id, project_id, span, kind, created_from_block_id, created_at]
      additionalProperties: false
      if: {properties: {kind: {const: pin}}}
      then: {properties: {project_id: {type: string, format: uuid}}}
      properties:
        id: {type: string, format: uuid}
        project_id: {type: [string, 'null'], format: uuid}
        span: {$ref: '#/components/schemas/Span'}
        kind: {$ref: '#/components/schemas/PinKind'}
        created_from_block_id: {type: [string, 'null'], format: uuid, description: Provenance only; block rows churn with plan versions.}
        created_at: {type: string, format: date-time}
    PinList:
      type: object
      required: [pins]
      additionalProperties: false
      properties:
        pins:
          type: array
          items: {$ref: '#/components/schemas/BlockPin'}

    # ---------------------------------------------------------------- todos
    TodoKind: {type: string, enum: [daily, weekly, one_off]}
    Todo:
      type: object
      description: |
        todos row + completion state. Daily and weekly todos are recurring checklists:
        `completed_periods` lists which of the current and previous period starts are ticked
        (always `[]` for one_off, and `completed_at` is null for recurring kinds). One-off
        `completed_at` is set while done. Tracking only in v1; calendar integration is later.
      required: [id, kind, title, notes, due_date, position, completed_at, completed_periods,
                 created_at]
      additionalProperties: false
      if: {properties: {kind: {const: one_off}}}
      then: {properties: {completed_periods: {maxItems: 0}}}
      else: {properties: {completed_at: {type: 'null'}}}
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        kind: {$ref: '#/components/schemas/TodoKind'}
        title: {type: string, minLength: 1, maxLength: 200}
        notes: {type: [string, 'null'], maxLength: 2000}
        due_date: {type: [string, 'null'], format: date, description: One-off only; local date.}
        position: {type: integer, minimum: 0}
        completed_at: {type: [string, 'null'], format: date-time}
        completed_periods:
          type: array
          uniqueItems: true
          items: {type: string, format: date}
        created_at: {type: string, format: date-time}
    TodoDraft:
      type: object
      description: |
        Defaults (applied by the server): `kind` is `one_off`; `notes` is null; for a one_off with
        `due_date` omitted, `due_date` is today's local date (from X-Timezone). Recurring kinds
        never get a due date.
      required: [title]
      additionalProperties: false
      if: {required: [kind], properties: {kind: {enum: [daily, weekly]}}}
      then: {properties: {due_date: {type: 'null'}}}
      properties:
        kind: {$ref: '#/components/schemas/TodoKind', default: one_off}
        title: {type: string, minLength: 1, maxLength: 200}
        notes: {type: [string, 'null'], maxLength: 2000}
        due_date: {type: [string, 'null'], format: date, description: One_off only. Omitted on a one_off means today (server default); null means no due date.}
    TodoPatch:
      type: object
      description: Partial update. `kind` is not patchable (additionalProperties is false).
      minProperties: 1
      additionalProperties: false
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        notes: {type: [string, 'null'], maxLength: 2000}
        due_date: {type: [string, 'null'], format: date}
        done: {type: boolean, description: One-off only. true sets completed_at. false clears it and moves the todo to the end of the open one-offs.}
    TodoOrder:
      type: object
      description: |
        `ids` is the new manual order of the open todos of `kind`: every daily or weekly todo, or the
        one-offs with `completed_at` null. Done one-offs are excluded and keep their position.
      required: [kind, ids]
      additionalProperties: false
      properties:
        kind: {$ref: '#/components/schemas/TodoKind'}
        ids:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/Uuid'}
    TodoList:
      type: object
      required: [todos, periods]
      additionalProperties: false
      properties:
        todos:
          type: array
          items: {$ref: '#/components/schemas/Todo'}
        periods:
          type: object
          description: Current period starts, from X-Timezone and preferences.week_start.
          required: [daily, weekly]
          additionalProperties: false
          properties:
            daily: {type: string, format: date}
            weekly: {type: string, format: date}

    # ---------------------------------------------------------------- changesets
    Changeset:
      type: object
      description: |
        changesets row (user_id omitted) + the proposed plan and its diff against the live plan
        at proposal time. plan_id/plan/diff are null when no solve was possible yet (onboarding,
        before preferences exist). `narration` is deterministic template text for manual/system
        proposals; null for agent proposals (the agent's reply narrates).
      required: [id, status, reason, plan_id, staged, created_at, resolved_at, plan, diff, narration]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/ChangesetStatus'}
        reason: {$ref: '#/components/schemas/ChangesetReason'}
        plan_id: {type: [string, 'null'], format: uuid}
        staged:
          type: array
          description: |
            The staged mutations, unapplied until confirm. Empty ONLY when `reason` is `drift`
            (a re-solve that changes no constraint; O11, resolved 2026-11-16 T4.3) or
            `google_edit` (the user's pin was already applied; 2026-11-16 T4.3b); every other
            reason has at least one entry (enforced by the `if`/`then` below).
          minItems: 0
          items: {$ref: '#/components/schemas/StagedMutation'}
        created_at: {type: string, format: date-time}
        resolved_at: {type: [string, 'null'], format: date-time}
        plan:
          oneOf: [{$ref: '#/components/schemas/WeekPlan'}, {type: 'null'}]
        diff:
          oneOf: [{$ref: '#/components/schemas/PlanDiff'}, {type: 'null'}]
        narration: {type: [string, 'null']}
      # 2026-11-16 (T4.3, D25): `staged` may be empty only for a drift re-solve;
      # 2026-11-16 (T4.3b): or a google_edit knock-on re-solve.
      if:
        properties: {reason: {not: {enum: [drift, google_edit]}}}
      then:
        properties: {staged: {minItems: 1}}

    StagedMutation:
      description: |
        One element of changesets.staged. `kind` is a mutation_kind value (only the
        constraint-changing subset; plan_* kinds are trace rows written by the server, never staged).
        Payloads are server-resolved: ids pre-assigned, spans absolute.
      oneOf:
        - {$ref: '#/components/schemas/StagedProjectCreated'}
        - {$ref: '#/components/schemas/StagedProjectUpdated'}
        - {$ref: '#/components/schemas/StagedProjectArchived'}
        - {$ref: '#/components/schemas/StagedPreferencesUpdated'}
        - {$ref: '#/components/schemas/StagedExceptionAdded'}
        - {$ref: '#/components/schemas/StagedExceptionRemoved'}
        - {$ref: '#/components/schemas/StagedPinAdded'}
        - {$ref: '#/components/schemas/StagedPinRemoved'}
      discriminator:
        propertyName: kind
        mapping:
          project_created: '#/components/schemas/StagedProjectCreated'
          project_updated: '#/components/schemas/StagedProjectUpdated'
          project_archived: '#/components/schemas/StagedProjectArchived'
          preferences_updated: '#/components/schemas/StagedPreferencesUpdated'
          exception_added: '#/components/schemas/StagedExceptionAdded'
          exception_removed: '#/components/schemas/StagedExceptionRemoved'
          pin_added: '#/components/schemas/StagedPinAdded'
          pin_removed: '#/components/schemas/StagedPinRemoved'
    StagedProjectCreated:
      type: object
      required: [kind, source, interpretation, payload]
      additionalProperties: false
      properties:
        kind: {const: project_created}
        source: {$ref: '#/components/schemas/MutationSource'}
        interpretation: {type: [string, 'null']}
        payload:
          type: object
          required: [project_id, project]
          additionalProperties: false
          properties:
            project_id: {type: string, format: uuid, description: Pre-assigned; becomes projects.id on confirm.}
            project: {$ref: '#/components/schemas/ProjectDraft'}
    StagedProjectUpdated:
      type: object
      required: [kind, source, interpretation, payload]
      additionalProperties: false
      properties:
        kind: {const: project_updated}
        source: {$ref: '#/components/schemas/MutationSource'}
        interpretation: {type: [string, 'null']}
        payload:
          type: object
          required: [project_id, changes]
          additionalProperties: false
          properties:
            project_id: {type: string, format: uuid}
            changes: {$ref: '#/components/schemas/ProjectPatch'}
    StagedProjectArchived:
      type: object
      required: [kind, source, interpretation, payload]
      additionalProperties: false
      properties:
        kind: {const: project_archived}
        source: {$ref: '#/components/schemas/MutationSource'}
        interpretation: {type: [string, 'null']}
        payload:
          type: object
          required: [project_id]
          additionalProperties: false
          properties:
            project_id: {type: string, format: uuid}
    StagedPreferencesUpdated:
      type: object
      required: [kind, source, interpretation, payload]
      additionalProperties: false
      properties:
        kind: {const: preferences_updated}
        source: {$ref: '#/components/schemas/MutationSource'}
        interpretation: {type: [string, 'null']}
        payload:
          type: object
          required: [preferences]
          additionalProperties: false
          properties:
            preferences: {$ref: '#/components/schemas/UserPreferences'}
    StagedExceptionAdded:
      type: object
      required: [kind, source, interpretation, payload]
      additionalProperties: false
      properties:
        kind: {const: exception_added}
        source: {$ref: '#/components/schemas/MutationSource'}
        interpretation: {type: [string, 'null']}
        payload:
          type: object
          required: [exception_id, span, blocks_all, blocks_tags, reason]
          additionalProperties: false
          properties:
            exception_id: {type: string, format: uuid, description: Pre-assigned; becomes availability_exceptions.id on confirm.}
            span: {$ref: '#/components/schemas/Span'}
            blocks_all: {type: boolean}
            blocks_tags: {$ref: '#/components/schemas/TagList'}
            reason: {type: [string, 'null']}
          anyOf:
            - {properties: {blocks_all: {const: true}}}
            - {properties: {blocks_tags: {minItems: 1}}}
    StagedExceptionRemoved:
      type: object
      required: [kind, source, interpretation, payload]
      additionalProperties: false
      properties:
        kind: {const: exception_removed}
        source: {$ref: '#/components/schemas/MutationSource'}
        interpretation: {type: [string, 'null']}
        payload:
          type: object
          required: [exception_id]
          additionalProperties: false
          properties:
            exception_id: {type: string, format: uuid}
    StagedPinAdded:
      type: object
      required: [kind, source, interpretation, payload]
      additionalProperties: false
      properties:
        kind: {const: pin_added}
        source: {$ref: '#/components/schemas/MutationSource'}
        interpretation: {type: [string, 'null']}
        payload:
          type: object
          description: block_pins row to insert. project_id null only for a blanket forbid.
          required: [pin_id, project_id, span, kind, created_from_block_id]
          additionalProperties: false
          if: {properties: {kind: {const: pin}}}
          then: {properties: {project_id: {type: string, format: uuid}}}
          properties:
            pin_id: {type: string, format: uuid}
            project_id: {type: [string, 'null'], format: uuid}
            span: {$ref: '#/components/schemas/Span'}
            kind: {$ref: '#/components/schemas/PinKind'}
            created_from_block_id: {type: [string, 'null'], format: uuid}
    StagedPinRemoved:
      type: object
      required: [kind, source, interpretation, payload]
      additionalProperties: false
      properties:
        kind: {const: pin_removed}
        source: {$ref: '#/components/schemas/MutationSource'}
        interpretation: {type: [string, 'null']}
        payload:
          type: object
          required: [pin_id]
          additionalProperties: false
          properties:
            pin_id: {type: string, format: uuid}

    # ---------------------------------------------------------------- agent
    AgentMessageRequest:
      type: object
      description: Full client-held transcript; the last message must have role `user` (else 422). The `content` lengths of all messages total at most 32,000 characters, counted in Unicode code points (else 422); the client drops the oldest messages to fit.
      required: [messages]
      additionalProperties: false
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 200
          items: {$ref: '#/components/schemas/TranscriptMessage'}
    TranscriptMessage:
      type: object
      required: [role, content]
      additionalProperties: false
      properties:
        role: {type: string, enum: [user, assistant]}
        content: {type: string, minLength: 1, maxLength: 8000, description: Plain text. For assistant turns, the `done.reply` text verbatim.}
        changeset_id:
          type: [string, 'null']
          format: uuid
          description: On assistant turns, the changeset that turn produced (from `done`), so the agent can reference it.

    AgentStreamEvent:
      description: One parsed SSE frame — `event` is the SSE event name, `data` the JSON payload.
      oneOf:
        - {$ref: '#/components/schemas/AgentStatusEvent'}
        - {$ref: '#/components/schemas/AgentDeltaEvent'}
        - {$ref: '#/components/schemas/AgentDoneEvent'}
        - {$ref: '#/components/schemas/AgentErrorEvent'}
      discriminator:
        propertyName: event
        mapping:
          status: '#/components/schemas/AgentStatusEvent'
          delta: '#/components/schemas/AgentDeltaEvent'
          done: '#/components/schemas/AgentDoneEvent'
          error: '#/components/schemas/AgentErrorEvent'
    AgentStatusEvent:
      type: object
      required: [event, data]
      additionalProperties: false
      properties:
        event: {const: status}
        data:
          type: object
          required: [phase]
          additionalProperties: false
          properties:
            phase:
              type: string
              enum: [staging, solving]
              description: staging = a stage_* tool is running; solving = propose_schedule is running the solver.
    AgentDeltaEvent:
      type: object
      required: [event, data]
      additionalProperties: false
      properties:
        event: {const: delta}
        data:
          type: object
          required: [text]
          additionalProperties: false
          properties:
            text: {type: string, minLength: 1}
    AgentDoneEvent:
      type: object
      description: Terminal. `reply` is authoritative — clients replace streamed delta text with it.
      required: [event, data]
      additionalProperties: false
      properties:
        event: {const: done}
        data:
          oneOf:
            - type: object
              required: [outcome, reply, changeset]
              additionalProperties: false
              properties:
                outcome: {const: completed}
                reply: {type: string, minLength: 1}
                changeset:
                  oneOf: [{$ref: '#/components/schemas/Changeset'}, {type: 'null'}]
            - type: object
              description: Model refusal (stop_reason=refusal). Polite decline; zero state change.
              required: [outcome, reply, changeset]
              additionalProperties: false
              properties:
                outcome: {const: refused}
                reply: {type: string, minLength: 1}
                changeset: {type: 'null'}
    AgentErrorEvent:
      type: object
      description: Terminal. Nothing from this turn was staged; discard streamed text.
      required: [event, data]
      additionalProperties: false
      properties:
        event: {const: error}
        data:
          type: object
          required: [error]
          additionalProperties: false
          properties:
            error: {$ref: '#/components/schemas/ErrorBody'}

    # ---------------------------------------------------------------- gcal
    GcalConnectUrl:
      type: object
      required: [authorization_url]
      additionalProperties: false
      properties:
        authorization_url: {type: string, format: uri}
    GcalCompleteRequest:
      type: object
      description: From the `result=authorized` callback redirect, URL-decoded (D24).
      required: [auth_code, state]
      additionalProperties: false
      properties:
        auth_code: {type: string, minLength: 1}
        state: {type: string, minLength: 1}
    GoogleConnection:
      type: object
      description: google_connections row minus secrets (user_id, refresh_token_enc, key_id omitted).
      required: [google_email, scopes, app_calendar_id, status, revoked_at, created_at]
      additionalProperties: false
      properties:
        google_email: {type: string, format: email}
        scopes: {type: array, items: {type: string}}
        app_calendar_id: {type: [string, 'null']}
        status: {$ref: '#/components/schemas/ConnectionStatus'}
        revoked_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
    GcalStatus:
      type: object
      required: [connection]
      additionalProperties: false
      properties:
        connection:
          oneOf: [{$ref: '#/components/schemas/GoogleConnection'}, {type: 'null'}]
    GcalSyncResult:
      type: object
      description: POST /gcal/sync answer (2026-11-16, T4.3; NOTES D25).
      required: [pending_changeset, outbox]
      additionalProperties: false
      properties:
        pending_changeset:
          description: The user's current pending changeset (at most one, D4), else null.
          oneOf: [{$ref: '#/components/schemas/Changeset'}, {type: 'null'}]
        outbox: {$ref: '#/components/schemas/OutboxCounts'}
    OutboxCounts:
      type: object
      description: |
        Write-back state of the blocks in live plans of the current and future weeks, after
        the drain. `pending`: not yet written to Google (retried automatically); `synced`:
        written. Both 0 when Google Calendar is not connected.
      required: [pending, synced]
      additionalProperties: false
      properties:
        pending: {type: integer, minimum: 0}
        synced: {type: integer, minimum: 0}
