name: server

on:
  push:
    branches: [main]
    paths: ["server/**", "contracts/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "contracts/**", ".github/workflows/server.yml"]
  schedule:
    - cron: "0 7 * * *"  # nightly slow property suite (~15 min)
  workflow_dispatch: {}

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Production runs Postgres 16 on Neon (CLAUDE.md); keep CI on the same major.
        image: postgres:16
        env:
          POSTGRES_USER: rmt
          POSTGRES_PASSWORD: rmt
          POSTGRES_DB: rmt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rmt -d rmt_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://rmt:rmt@localhost:5432/rmt_test
    defaults:
      run:
        working-directory: server
        shell: bash  # explicit bash = -eo pipefail, so `pytest | tee` still fails on test failures
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Scheduler purity contract
        run: uv run lint-imports

      - name: Tests (including Postgres-only)
        # The 10k-example solver property run is marked `slow` and excluded here.
        # -rs lists skip reasons; fail if any Postgres test skipped, since running them is the point of this job.
        run: |
          uv run pytest -q -rs | tee pytest.log
          if grep -q "TEST_DATABASE_URL not set" pytest.log; then
            echo "::error::Postgres-only tests were skipped in CI"; exit 1
          fi

      - name: Contract fixtures round-trip
        run: uv run --with openapi-spec-validator --with 'jsonschema[format]' --with rfc3339-validator python ../contracts/validate_fixtures.py

  slow:
    # The 10k + 5k-example solver property runs (~15 min): nightly and on demand, not per push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --locked
      - name: Slow property tests
        # exit 5 = no tests collected (no slow-marked tests on this ref); treat as pass
        run: uv run pytest -q -m slow || [ $? -eq 5 ]
